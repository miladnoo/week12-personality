<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Personality Types — Week 12</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#0b0d12; --ink-2:#59626f; --ink-3:#8b949e;
    --line:#e3e6ec; --accent:#2f6bff; --accent-soft:#e9f0ff; --accent-ink:#1a3fb0;
    --c1:#e0523f; --c2:#e09a2d; --c3:#2a9d6b; --c4:#3b78d8;
    --r:18px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0a0c11; --card:#161a21; --ink:#f2f4f8; --ink-2:#a3acb9; --ink-3:#6b7482;
           --line:#242a34; --accent:#6b9aff; --accent-soft:#1a2434; --accent-ink:#b6ccff; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{height:100%;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font);
    -webkit-font-smoothing:antialiased; line-height:1.35;
    overscroll-behavior-y:contain; position:fixed; inset:0;
  }
  .wrap{
    height:100dvh; display:flex; flex-direction:column;
    padding:
      max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-left))
      max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right));
    max-width:520px; margin:0 auto; gap:8px;
  }

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .brand{font-size:14px;font-weight:750;letter-spacing:-.01em;line-height:1.1}
  .brand small{display:block;font-size:10px;font-weight:650;color:var(--ink-3);
    letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
  .dots{display:flex;gap:4px;margin-left:auto}
  .dots i{width:7px;height:7px;border-radius:99px;background:var(--line);display:block;
    transition:background .22s, transform .22s}
  .dots i.done{background:var(--accent)}
  .dots i.now{background:var(--accent);transform:scale(1.5)}

  /* ---------- step ---------- */
  .step{display:flex;align-items:baseline;gap:7px;flex:0 0 auto;margin-top:1px}
  .step b{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1;
    font-variant-numeric:tabular-nums}
  .step span{font-size:12.5px;font-weight:650;color:var(--ink-3)}

  .cue{font-size:12.5px;font-weight:650;color:var(--ink-2);flex:0 0 auto;
    display:flex;align-items:center;gap:5px;margin-bottom:1px}
  .cue em{font-style:normal;color:var(--accent);font-weight:750}

  /* ---------- options ---------- */
  .opts{display:flex;flex-direction:column;gap:9px;flex:1 1 auto;
    justify-content:center;min-height:0;margin-top:2px}
  button.opt{
    -webkit-appearance:none;appearance:none;font:inherit;color:var(--ink);
    position:relative;width:100%;text-align:left;cursor:pointer;
    background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
    padding:16px 14px 16px 56px;min-height:62px;
    display:flex;align-items:center;
    font-size:16.5px;font-weight:650;letter-spacing:-.012em;line-height:1.22;
    transition:transform .12s cubic-bezier(.22,1,.36,1),border-color .16s,background .16s,color .16s;
    touch-action:manipulation;
  }
  button.opt:active{transform:scale(.98)}
  button.opt .rank{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:1.5px dashed var(--line);
    font-size:13.5px;font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums;
    transition:all .18s cubic-bezier(.22,1,.36,1);
  }
  button.opt[data-r]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
  button.opt[data-r] .rank{
    background:var(--accent);border:1.5px solid var(--accent);color:#fff;
    transform:translateY(-50%) scale(1.08);
  }

  /* ---------- nav ---------- */
  .nav{display:flex;gap:9px;flex:0 0 auto}
  button.nav-btn{
    -webkit-appearance:none;appearance:none;font:inherit;
    flex:1;padding:15px;border-radius:15px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-size:16px;font-weight:700;transition:transform .12s cubic-bezier(.22,1,.36,1),opacity .18s;
    touch-action:manipulation;
  }
  button.nav-btn:active{transform:scale(.975)}
  button.nav-btn[disabled]{opacity:.35}
  button.nav-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  button.nav-btn.ghost{flex:0 0 52px;font-size:19px;padding:15px 0}

  /* ---------- totals ---------- */
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:0 0 auto;
    margin-top:3px;padding-top:8px;border-top:1px solid var(--line)}
  .sc{text-align:center;padding:4px 0;border-radius:9px;transition:background .22s}
  .sc b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;
    letter-spacing:-.025em;line-height:1.1}
  .sc i{display:block;font-size:9px;font-weight:750;color:var(--ink-3);letter-spacing:.07em;
    text-transform:uppercase;font-style:normal;margin-top:2px}
  .sc.lead{background:var(--accent-soft)}
  .sc.lead b,.sc.lead i{color:var(--accent)}

  /* ---------- final ---------- */
  .final{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
    text-align:center;gap:5px;overflow-y:auto;min-height:0;padding:4px 0}
  .final .lbl{font-size:10px;font-weight:750;color:var(--ink-3);
    text-transform:uppercase;letter-spacing:.1em}
  .final .animal{font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:1px 0 5px}
  .final .say{font-size:14px;color:var(--ink-2);margin:0 0 14px;max-width:32ch;
    margin-inline:auto;line-height:1.42}
  .bars{display:flex;flex-direction:column;gap:9px;width:100%;max-width:330px;margin:0 auto}
  .brow{display:grid;grid-template-columns:minmax(70px,auto) 1fr 24px;align-items:center;
    gap:8px;font-size:12px}
  .brow .nm{font-weight:750;color:var(--ink-2);letter-spacing:.02em;text-align:left}
  .brow .tr{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:block}
  .brow .tr i{display:block;height:100%;border-radius:99px;width:0;
    transition:width .5s cubic-bezier(.22,1,.36,1)}
  .brow .vv{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}

  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translate(-50%,18px);background:var(--ink);color:var(--bg);
    font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:99px;
    opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.22,1,.36,1);
    z-index:99;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-height:620px){
    button.opt{min-height:50px;padding:11px 12px 11px 52px;font-size:15.5px}
    .step b{font-size:21px}
    .final .animal{font-size:30px}
    .brand small{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">Personality Types<small>Week 12 · Intro to Business</small></div>
    <div class="dots" id="dots"></div>
  </div>

  <!-- quiz -->
  <div id="quizview" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0;gap:8px">
    <div class="step"><b id="stepN">1</b><span id="stepOf">of 10</span></div>
    <div class="cue">Tap the one <em>most</em> like you first</div>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button class="nav-btn ghost" id="back" type="button" aria-label="Previous">‹</button>
      <button class="nav-btn primary" id="next" type="button" disabled>Next</button>
    </div>
    <div class="strip" id="strip">
      <div class="sc" id="s0"><b>0</b><i>Lion</i></div>
      <div class="sc" id="s1"><b>0</b><i>Otter</i></div>
      <div class="sc" id="s2"><b>0</b><i>Retriever</i></div>
      <div class="sc" id="s3"><b>0</b><i>Beaver</i></div>
    </div>
  </div>

  <!-- final -->
  <div class="final" id="finalview" hidden>
    <div class="lbl">Your type</div>
    <div class="animal" id="animal">—</div>
    <p class="say" id="say"></p>
    <div class="bars" id="bars"></div>
    <div class="nav" style="margin-top:16px;width:100%">
      <button class="nav-btn ghost" id="review" type="button" aria-label="Review">‹</button>
      <button class="nav-btn primary" id="share" type="button">Copy answers link</button>
    </div>
    <div class="nav" style="width:100%">
      <button class="nav-btn" id="restart" type="button">Start over</button>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var ROWS = [
    ["Likes Having Authority","Enthusiastic","Sensitive Feelings","Likes Instruction"],
    ["Takes Charge","Takes Risks","Loyal","Accurate"],
    ["Determined","Imaginative","Calm","Consistent"],
    ["Tries New Ideas","Likes to Talk","Enjoys Having a Schedule","Organized"],
    ["Competitive","Shares Ideas","Dislikes Change","Practical"],
    ["Problem Solver","Enjoys Popularity","Diplomatic","Factual"],
    ["Productive","Fun-loving","Avoids Confrontations","Responsible"],
    ["Bold","Likes Variety","Easy Going","Prefers Perfection"],
    ["Decision Maker","Spontaneous","Nurturing","Detail-Oriented"],
    ["Persistent","Loves People","Peacemaker","Logical"]
  ];
  var TYPES = [
    {k:"LION", c:0, col:"var(--c1)",
     say:"Driven and decisive — you take charge and move fast. Growth edge: listen before deciding."},
    {k:"OTTER", c:1, col:"var(--c2)",
     say:"Expressive and energetic — you bring the energy. Growth edge: finish what you start."},
    {k:"RETRIEVER", c:2, col:"var(--c3)",
     say:"Loyal and steady — you're the glue of the team. Growth edge: say the hard thing."},
    {k:"BEAVER", c:3, col:"var(--c4)",
     say:"Accurate and thorough — you get it right. Growth edge: ship before perfect."}
  ];

  var picks = ROWS.map(function(){ return []; });
  var cur = 0;
  var $ = function(id){ return document.getElementById(id); };

  function toast(m){
    var t = $("toast"); t.textContent = m; t.classList.add("on");
    setTimeout(function(){ t.classList.remove("on"); }, 1900);
  }
  function rating(r, c){ var i = picks[r].indexOf(c); return i < 0 ? 0 : 4 - i; }
  function totals(){
    var t = [0,0,0,0];
    ROWS.forEach(function(_, r){ picks[r].forEach(function(c,i){ t[c] += 4 - i; }); });
    return t;
  }
  function done(){ return picks.every(function(p){ return p.length === 4; }); }

  function render(){
    var dots = $("dots"); dots.innerHTML = "";
    ROWS.forEach(function(_, i){
      var d = document.createElement("i");
      if (picks[i].length === 4) d.className = i === cur ? "done now" : "done";
      else if (i === cur) d.className = "now";
      dots.appendChild(d);
    });

    $("stepN").textContent = String(cur + 1);
    $("stepOf").textContent = "of " + ROWS.length;

    var opts = $("opts"); opts.innerHTML = "";
    ROWS[cur].forEach(function(txt, c){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      b.dataset.col = c;

      var rk = document.createElement("span");
      rk.className = "rank";
      var v = rating(cur, c);
      rk.textContent = v ? String(v) : "";

      var lb = document.createElement("span");
      lb.textContent = txt;

      b.appendChild(rk); b.appendChild(lb);
      if (v) b.dataset.r = String(v);
      b.addEventListener("click", function(){ tap(c); });
      opts.appendChild(b);
    });

    $("back").disabled = cur === 0;
    var nb = $("next");
    var full = picks[cur].length === 4;
    nb.disabled = !full;
    nb.textContent = (full && cur === ROWS.length - 1) ? "See result" : "Next";

    sync();
  }

  function tap(c){
    var idx = picks[cur].indexOf(c);
    if (idx >= 0) picks[cur].splice(idx, 1);
    else picks[cur].push(c);

    var bs = $("opts").querySelectorAll("button.opt");
    for (var i = 0; i < bs.length; i++){
      var b = bs[i], col = parseInt(b.dataset.col, 10), v = rating(cur, col);
      if (v){ b.dataset.r = String(v); b.querySelector(".rank").textContent = v; }
      else { b.removeAttribute("data-r"); b.querySelector(".rank").textContent = ""; }
    }

    var full = picks[cur].length === 4;
    var nb = $("next");
    nb.disabled = !full;
    nb.textContent = (full && cur === ROWS.length - 1) ? "See result" : "Next";

    var d = $("dots").children[cur];
    if (d) d.className = full ? "done now" : "now";

    sync();

    if (full && cur < ROWS.length - 1){
      setTimeout(function(){
        if (picks[cur].length === 4 && cur < ROWS.length - 1){ cur++; render(); }
      }, 330);
    }
  }

  function sync(){
    var t = totals();
    for (var i = 0; i < 4; i++) $("s" + i).querySelector("b").textContent = t[i];
    var lead = t.indexOf(Math.max.apply(null, t));
    for (var j = 0; j < 4; j++){
      var el = $("s" + j);
      if (j === lead && done()) el.classList.add("lead");
      else el.classList.remove("lead");
    }
  }

  function finish(){
    sync();
    var t = totals();
    var win = TYPES[t.indexOf(Math.max.apply(null, t))];
    $("animal").textContent = win.k;
    $("say").textContent = win.say;

    var bars = $("bars"); bars.innerHTML = "";
    TYPES.forEach(function(ty){
      var row = document.createElement("div"); row.className = "brow";
      var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = ty.k;
      var tr = document.createElement("span"); tr.className = "tr";
      var i = document.createElement("i"); i.style.background = ty.col; tr.appendChild(i);
      var vv = document.createElement("span"); vv.className = "vv"; vv.textContent = t[ty.c];
      row.appendChild(nm); row.appendChild(tr); row.appendChild(vv);
      bars.appendChild(row);
      setTimeout(function(){ i.style.width = (t[ty.c] / 40 * 100) + "%"; }, 70);
    });

    $("quizview").style.display = "none";
    $("finalview").hidden = false;
  }

  function toQuiz(){
    $("finalview").hidden = true;
    $("quizview").style.display = "flex";
    render();
  }

  function encode(){
    return picks.map(function(order){
      return [0,1,2,3].map(function(c){
        var i = order.indexOf(c);
        return i < 0 ? 0 : 4 - i;
      }).join("");
    }).join("");
  }

  function copyIt(text, msg){
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly","");
      ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0";
      ta.style.opacity = "0"; ta.style.fontSize = "16px";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
      document.body.removeChild(ta);
      toast(ok ? msg : "Copy blocked — long-press to copy");
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(msg); }).catch(fallback);
    } else fallback();
  }

  $("next").addEventListener("click", function(){
    if (picks[cur].length !== 4) return;
    if (cur === ROWS.length - 1) finish();
    else { cur++; render(); }
  });
  $("back").addEventListener("click", function(){ if (cur > 0){ cur--; render(); } });
  $("review").addEventListener("click", function(){ cur = 0; toQuiz(); });
  $("restart").addEventListener("click", function(){
    picks = ROWS.map(function(){ return []; }); cur = 0; toQuiz();
  });
  $("share").addEventListener("click", function(){
    copyIt(location.origin + location.pathname + "#a=" + encode(), "Link copied — send it back");
  });

  function restore(){
    var m = /a=([0-4]{40})/.exec(location.hash || "");
    if (!m) return false;
    var s = m[1];
    for (var r = 0; r < 10; r++){
      var chunk = s.substr(r * 4, 4), order = [];
      for (var v = 4; v >= 1; v--){
        var i = chunk.indexOf(String(v));
        if (i >= 0) order.push(i);
      }
      picks[r] = order;
    }
    return done();
  }

  if (restore()) finish(); else render();

  var sx = null, sy = null;
  document.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if (sx === null || !$("finalview").hidden) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx)) return;
    if (dx < 0 && picks[cur].length === 4 && cur < ROWS.length - 1){ cur++; render(); }
    else if (dx > 0 && cur > 0){ cur--; render(); }
  }, {passive:true});
})();
</script>
</body>
</html>
