<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)">
<title>Personality Types — Week 12</title>
<style>
  :root{
    --bg:#f7f7f9; --card:#fff; --ink:#0b0d12; --ink-2:#5b6470; --ink-3:#8b949e;
    --line:#e4e7ec; --accent:#2f6bff; --accent-soft:#eaf1ff;
    --c1:#e0523f; --c2:#e8a33d; --c3:#2e9e6b; --c4:#3b78d8;
    --radius:16px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0d12; --card:#151920; --ink:#f2f4f8; --ink-2:#a3acb9; --ink-3:#6d7684;
           --line:#252b36; --accent:#5b8cff; --accent-soft:#1c2433; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font);
    -webkit-font-smoothing:antialiased; line-height:1.45;
    padding:max(16px,env(safe-area-inset-top)) 16px max(120px,env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
  }
  h1{font-size:24px;letter-spacing:-.02em;margin:8px 0 2px;font-weight:650}
  .sub{color:var(--ink-2);font-size:14px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        padding:16px;margin-bottom:12px}
  .label{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;
         letter-spacing:.06em;margin:0 0 8px}
  input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
  input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .howto{background:var(--accent-soft);border:1px solid transparent;border-radius:var(--radius);
         padding:14px 16px;margin-bottom:16px;font-size:14px;color:var(--ink)}
  .howto b{font-weight:650}
  .howto .demo{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .demo span{font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;
             background:var(--card);border:1px solid var(--line)}

  .prog{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0%;background:var(--accent);border-radius:99px;
         transition:width .35s cubic-bezier(.22,1,.36,1)}
  .prog b{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}

  .q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
     padding:14px;margin-bottom:10px;transition:border-color .2s,box-shadow .2s}
  .q.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .qn{font-size:12px;font-weight:650;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
  .reset{font-size:12px;font-weight:600;color:var(--ink-3);background:none;border:0;
         padding:6px 8px;border-radius:8px;cursor:pointer;font-family:inherit}
  .reset:hover{background:var(--bg);color:var(--ink)}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button.opt{
    position:relative;font:inherit;font-size:14px;font-weight:600;text-align:left;
    padding:14px 12px;min-height:60px;border-radius:12px;cursor:pointer;
    border:1.5px solid var(--line);background:var(--bg);color:var(--ink);
    transition:transform .12s cubic-bezier(.22,1,.36,1),border-color .18s,background .18s;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  button.opt:active{transform:scale(.975)}
  button.opt[data-r]{border-color:var(--accent);background:var(--accent-soft)}
  button.opt .num{
    flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:8px;font-size:13px;font-weight:700;
    background:var(--line);color:var(--ink-3);transition:all .18s;
  }
  button.opt[data-r] .num{background:var(--accent);color:#fff}

  .totals{position:sticky;bottom:0;margin-top:18px;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);padding:12px;
    box-shadow:0 -6px 24px -12px rgba(0,0,0,.25);backdrop-filter:blur(8px)}
  .totals .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .totals .cell{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.03em}
  .totals .val{font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;display:block;margin-top:1px}
  .totals .cell[data-lead] .val{color:var(--accent)}

  .result{margin-top:16px;padding:20px;border-radius:var(--radius);background:var(--card);
    border:1px solid var(--line);text-align:center}
  .result .animal{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 2px}
  .result .blurb{color:var(--ink-2);font-size:14px;margin:0 0 14px}
  .bars{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .brow{display:grid;grid-template-columns:88px 1fr 28px;align-items:center;gap:10px;font-size:13px}
  .brow .nm{font-weight:600;color:var(--ink-2);text-align:left}
  .brow .tr{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
  .brow .tr i{display:block;height:100%;border-radius:99px;width:0;transition:width .5s cubic-bezier(.22,1,.36,1)}
  .brow .vv{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

  .actions{display:grid;gap:10px;margin-top:18px}
  button.act{font:inherit;font-size:15px;font-weight:650;padding:15px;border-radius:14px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
    transition:transform .12s cubic-bezier(.22,1,.36,1)}
  button.act:active{transform:scale(.98)}
  button.act.primary{background:var(--accent);border-color:transparent;color:#fff}
  button.act[disabled]{opacity:.45;cursor:not-allowed}
  .hint{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:10px;line-height:1.5}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:12px 18px;
    border-radius:99px;opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.22,1,.36,1);z-index:99}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media(min-width:520px){ .opts{grid-template-columns:repeat(4,1fr)} button.opt{min-height:84px;flex-direction:column;
    align-items:flex-start;justify-content:space-between} button.opt .num{position:absolute;top:10px;right:10px} }
</style>
</head>
<body>

<h1>Personality Types</h1>
<p class="sub">Week 12 · Intro to Business · Lions, Otters, Retrievers &amp; Beavers</p>

<div class="card">
  <p class="label">Name</p>
  <input type="text" id="who" value="Milad Noori" autocomplete="name" spellcheck="false">
</div>

<div class="howto">
  <b>Tap in order: MOST like you first → least like you last.</b>
  <div class="demo">
    <span>1st tap = 4</span><span>2nd = 3</span><span>3rd = 2</span><span>4th = 1</span>
  </div>
</div>

<div class="prog"><div class="bar"><i id="progbar"></i></div><b id="progtxt">0 / 10</b></div>

<div id="quiz"></div>

<div class="totals">
  <div class="row">
    <div class="cell" id="t0">LION<span class="val">0</span></div>
    <div class="cell" id="t1">OTTER<span class="val">0</span></div>
    <div class="cell" id="t2">RETRIEVER<span class="val">0</span></div>
    <div class="cell" id="t3">BEAVER<span class="val">0</span></div>
  </div>
</div>

<div class="result" id="result" hidden>
  <p class="label" style="margin-bottom:4px">Your type</p>
  <p class="animal" id="animal">—</p>
  <p class="blurb" id="blurb"></p>
  <div class="bars" id="bars"></div>
</div>

<div class="actions">
  <button class="act primary" id="copy" disabled>Copy answers link</button>
  <button class="act" id="copytext" disabled>Copy answers as text</button>
  <button class="act" id="again">Start over</button>
</div>
<p class="hint" id="hint">Finish all 10 rows to unlock copying.</p>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var ROWS = [
    ["Likes Having Authority","Enthusiastic","Sensitive Feelings","Likes Instruction"],
    ["Takes Charge","Takes Risks","Loyal","Accurate"],
    ["Determined","Imaginative","Calm","Consistent"],
    ["Tries New Ideas","Likes to Talk","Enjoys Having a Schedule","Organized"],
    ["Competitive","Shares Ideas","Dislikes Change","Practical"],
    ["Problem Solver","Enjoys Popularity","Diplomatic","Factual"],
    ["Productive","Fun-loving","Avoids Confrontations","Responsible"],
    ["Bold","Likes Variety","Easy Going","Prefers Perfection"],
    ["Decision Maker","Spontaneous","Nurturing","Detail-Oriented"],
    ["Persistent","Loves People","Peacemaker","Logical"]
  ];

  var TYPES = [
    {key:"LION", col:0, color:"var(--c1)",
     say:"The Lion — driven, decisive, takes charge. You lead from the front and move fast.",
     blurb:"Lions like authority and results. Biggest growth edge: listening before deciding."},
    {key:"OTTER", col:1, color:"var(--c2)",
     say:"The Otter — expressive, enthusiastic, people-powered. You bring the energy.",
     blurb:"Otters win on rapport and momentum. Biggest growth edge: finishing what you start."},
    {key:"RETRIEVER", col:2, color:"var(--c3)",
     say:"The Retriever — loyal, calm, steady. You are the glue that holds a team together.",
     blurb:"Retrievers build trust and keep peace. Biggest growth edge: saying the hard thing."},
    {key:"BEAVER", col:3, color:"var(--c4)",
     say:"The Beaver — accurate, organized, thorough. You get it right, not just done.",
     blurb:"Beavers deliver quality and precision. Biggest growth edge: shipping before perfect."}
  ];

  var picks = ROWS.map(function(){ return []; }); // order of tapped columns per row

  var $ = function(id){ return document.getElementById(id); };
  var quiz = $("quiz");

  function build(){
    quiz.innerHTML = "";
    ROWS.forEach(function(row, r){
      var card = document.createElement("div");
      card.className = "q";
      card.id = "q" + r;

      var head = document.createElement("div");
      head.className = "qhead";
      var qn = document.createElement("span");
      qn.className = "qn";
      qn.textContent = "Row " + (r + 1) + " of 10";
      var rs = document.createElement("button");
      rs.className = "reset";
      rs.type = "button";
      rs.textContent = "Reset";
      rs.addEventListener("click", function(){ picks[r] = []; paintRow(r); sync(); });
      head.appendChild(qn); head.appendChild(rs);

      var opts = document.createElement("div");
      opts.className = "opts";

      row.forEach(function(text, c){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt";
        b.dataset.row = r; b.dataset.col = c;
        var t = document.createElement("span");
        t.textContent = text;
        var n = document.createElement("span");
        n.className = "num";
        n.textContent = "";
        b.appendChild(t); b.appendChild(n);
        b.addEventListener("click", function(){ tap(r, c); });
        opts.appendChild(b);
      });

      card.appendChild(head); card.appendChild(opts);
      quiz.appendChild(card);
    });
    paint();
  }

  function ratingOf(r, c){
    var i = picks[r].indexOf(c);
    return i < 0 ? 0 : 4 - i;
  }

  function tap(r, c){
    var idx = picks[r].indexOf(c);
    if (idx >= 0) picks[r].splice(idx, 1);
    else picks[r].push(c);
    paintRow(r);
    sync();
    if (picks[r].length === 4) {
      var card = $("q" + r);
      card.style.transform = "scale(1.012)";
      setTimeout(function(){ card.style.transform = ""; }, 130);
    }
  }

  function paint(){
    ROWS.forEach(function(_, r){ paintRow(r); });
    sync();
  }

  function paintRow(r){
    var opts = document.querySelectorAll('.q#q' + r + ' button.opt');
    for (var i = 0; i < opts.length; i++){
      var b = opts[i];
      var c = parseInt(b.dataset.col, 10);
      var v = ratingOf(r, c);
      if (v) { b.dataset.r = String(v); b.querySelector(".num").textContent = v; }
      else   { delete b.dataset.r;    b.querySelector(".num").textContent = ""; }
    }
    var card = $("q" + r);
    if (card) card.classList.toggle("done", picks[r].length === 4);
  }

  function totals(){
    var t = [0,0,0,0];
    ROWS.forEach(function(_, r){
      picks[r].forEach(function(c, i){ t[c] += 4 - i; });
    });
    return t;
  }

  function complete(){
    return picks.every(function(p){ return p.length === 4; });
  }

  function sync(){
    var t = totals();
    for (var i = 0; i < 4; i++){
      var cell = $("t" + i);
      cell.querySelector(".val").textContent = t[i];
    }
    var lead = t.indexOf(Math.max.apply(null, t));
    for (var j = 0; j < 4; j++){
      var el = $("t" + j);
      if (j === lead && complete()) el.setAttribute("data-lead","1");
      else el.removeAttribute("data-lead");
    }

    var doneN = picks.filter(function(p){ return p.length === 4; }).length;
    $("progbar").style.width = (doneN / ROWS.length * 100) + "%";
    $("progtxt").textContent = doneN + " / " + ROWS.length;

    var ok = complete();
    $("copy").disabled = !ok;
    $("copytext").disabled = !ok;
    $("result").hidden = !ok;
    $("hint").textContent = ok
      ? "Copy the link and send it back — that carries every answer."
      : "Finish all " + ROWS.length + " rows to unlock copying.";

    if (ok) showResult(t);
  }

  function showResult(t){
    var max = Math.max.apply(null, t);
    var winner = TYPES[t.indexOf(max)];
    $("animal").textContent = winner.key;
    $("blurb").textContent = winner.say;

    var bars = $("bars");
    bars.innerHTML = "";
    TYPES.forEach(function(ty){
      var v = t[ty.col];
      var row = document.createElement("div");
      row.className = "brow";

      var nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = ty.key;

      var tr = document.createElement("span");
      tr.className = "tr";
      var i = document.createElement("i");
      i.style.background = ty.color;
      tr.appendChild(i);

      var vv = document.createElement("span");
      vv.className = "vv"; vv.textContent = v;

      row.appendChild(nm); row.appendChild(tr); row.appendChild(vv);
      bars.appendChild(row);

      setTimeout(function(){ i.style.width = (v / 40 * 100) + "%"; }, 60);
    });
  }

  // encode: per row, the rating for columns 1..4 as digits -> 40 chars
  function encode(){
    return picks.map(function(order){
      var ratings = [1,2,3,4].map(function(c){
        var i = order.indexOf(c - 1);
        return i < 0 ? 0 : 4 - i;
      });
      return ratings.join("");
    }).join("");
  }

  function payload(){
    return { name: ($("who").value || "").trim(), date: new Date().toISOString().slice(0,10),
             answers: encode(), totals: totals() };
  }

  function toast(msg){
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("on");
    setTimeout(function(){ el.classList.remove("on"); }, 1900);
  }

  function copyIt(text, okMsg){
    var done = function(){ toast(okMsg); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else fallback();
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); }
      catch(e){ toast("Copy failed — select manually"); }
      document.body.removeChild(ta);
    }
  }

  $("copy").addEventListener("click", function(){
    var url = location.origin + location.pathname + "#a=" + encode() +
              "&n=" + encodeURIComponent(($("who").value || "").trim());
    copyIt(url, "Link copied — send it back");
  });

  $("copytext").addEventListener("click", function(){
    var p = payload();
    var lines = ["PERSONALITY TEST RESULTS", "Name: " + p.name, "Date: " + p.date, ""];
    ROWS.forEach(function(row, r){
      var parts = row.map(function(txt, c){ return ratingOf(r, c) + " " + txt; });
      lines.push("Row " + (r + 1) + ": " + parts.join(" · "));
    });
    lines.push("");
    lines.push("Lion: " + p.totals[0] + "  Otter: " + p.totals[1] +
               "  Retriever: " + p.totals[2] + "  Beaver: " + p.totals[3]);
    copyIt(lines.join("\n"), "Answers copied");
  });

  $("again").addEventListener("click", function(){
    picks = ROWS.map(function(){ return []; });
    paint();
    $("result").hidden = true;
    document.body.scrollIntoView({behavior:"smooth", block:"start"});
  });

  // restore from a shared link
  function restore(){
    var h = location.hash || "";
    var m = /a=([0-4]{40})/.exec(h);
    if (!m) return;
    var s = m[1];
    for (var r = 0; r < 10; r++){
      var chunk = s.substr(r * 4, 4);
      var order = [];
      for (var v = 4; v >= 1; v--){
        var idx = chunk.indexOf(String(v));
        if (idx >= 0) order.push(idx);
      }
      picks[r] = order;
    }
    var nm = /n=([^&]*)/.exec(h);
    if (nm) $("who").value = decodeURIComponent(nm[1]);
    paint();
  }

  build();
  restore();
})();
</script>
</body>
</html>
